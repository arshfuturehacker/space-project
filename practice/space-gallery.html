<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Photo Gallery</title>
<style>
  :root {
    --bg1: #05061a;
    --bg2: #131034;
    --accent: #7dd3fc;
    --accent2: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    background: radial-gradient(circle at 20% 10%, var(--bg2), var(--bg1) 65%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f0f0ff;
    padding: 2.5rem 1.2rem 4rem;
  }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  h1 {
    margin: 0 0 0.3rem;
    font-size: 2rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin: 0;
    color: #a8a8d0;
    font-size: 0.95rem;
  }

  .gallery {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.1rem;
  }
  .thumb {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    cursor: zoom-in;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    aspect-ratio: 4 / 3;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .thumb:hover, .thumb:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(125,211,252,0.25);
    outline: none;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0.55rem 0.7rem;
    font-size: 0.8rem;
    background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
    color: #fff;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(3,4,15,0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 0.4rem;
  }
  .lightbox.open {
    display: flex;
  }
  .lightbox-inner {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .lb-image-wrap {
    position: relative;
    display: inline-flex;
    max-width: 99vw;
    max-height: 100vh;
  }
  .lightbox-inner img {
    max-width: 99vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.7);
    user-select: none;
    cursor: zoom-out;
    display: block;
  }
  .lightbox-caption-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 2.2rem 1.5rem 0.9rem;
    background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
    border-radius: 0 0 8px 8px;
    text-align: center;
    pointer-events: none;
  }
  .lightbox-caption {
    color: #f0f0ff;
    font-size: 0.9rem;
    max-width: 80ch;
    margin: 0 auto;
  }
  .lightbox-counter {
    margin-top: 0.2rem;
    color: #c0c0e0;
    font-size: 0.75rem;
  }

  .lb-btn {
    position: absolute;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .lb-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.08); }

  .lb-close {
    top: 1rem;
    right: 1rem;
  }
  .lb-prev {
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
  }
  .lb-next {
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
  }
  .lb-prev:hover, .lb-next:hover { transform: translateY(-50%) scale(1.08); }

  /* Mobile adjustments */
  @media (max-width: 640px) {
    h1 { font-size: 1.5rem; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
    .lb-image-wrap { max-width: 100vw; max-height: 100vh; }
    .lightbox-inner img { max-width: 100vw; max-height: 100vh; }
    .lightbox-caption-wrap { padding: 1.6rem 0.8rem 0.6rem; }
    .lb-close {
      top: 0.4rem;
      right: 0.4rem;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
    }
    .lb-prev, .lb-next {
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
    }
    .lb-prev { left: 0.3rem; }
    .lb-next { right: 0.3rem; }
    .lightbox-caption { font-size: 0.75rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🌌 Space Photo Gallery</h1>
  <p>Click any image to view it larger — use the arrows or keyboard to browse</p>
</header>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lightbox-inner">
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">&#10094;</button>
    <div class="lb-image-wrap">
      <img id="lbImage" src="" alt="">
      <div class="lightbox-caption-wrap">
        <div class="lightbox-caption" id="lbCaption"></div>
        <div class="lightbox-counter" id="lbCounter"></div>
      </div>
    </div>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">&#10095;</button>
  </div>
</div>

      alt: "Artist's rendering of a black hole with a glowing accretion disk",
      caption: "An artist's rendering of a black hole, its intense gravity warping light from the disk around it."
    }
  ];

  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lbImage');
  const lbCaption = document.getElementById('lbCaption');
  const lbCounter = document.getElementById('lbCounter');
  let currentIndex = 0;

  function buildGallery() {
    images.forEach((img, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.tabIndex = 0;
      thumb.setAttribute('role', 'button');
      thumb.setAttribute('aria-label', 'Open image: ' + img.alt);
      thumb.innerHTML = `
        <img src="${img.src}" alt="${img.alt}" loading="lazy">
        <div class="caption">${img.alt}</div>
      `;
      thumb.addEventListener('click', () => openLightbox(i));
      thumb.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(i);
        }
      });
      gallery.appendChild(thumb);
    });
  }

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function updateLightbox() {
    const img = images[currentIndex];
    lbImage.src = img.src;
    lbImage.alt = img.alt;
    lbCaption.textContent = img.caption;
    lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateLightbox();
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % images.length;
    updateLightbox();
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', showPrev);
  document.getElementById('lbNext').addEventListener('click', showNext);
  lbImage.addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showPrev();
    if (e.key === 'ArrowRight') showNext();
  });

  buildGallery();
</script>
