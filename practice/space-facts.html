<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Fact Generator</title>
<style>
  :root {
    --bg1: #0b0c2a;
    --bg2: #1b1042;
    --accent: #7dd3fc;
    --accent2: #a78bfa;
    --card: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1) 60%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f0f0ff;
    overflow: hidden;
    position: relative;
  }
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20px 30px, white, transparent),
      radial-gradient(1px 1px at 90px 120px, white, transparent),
      radial-gradient(1.5px 1.5px at 160px 60px, white, transparent),
      radial-gradient(1px 1px at 220px 200px, white, transparent),
      radial-gradient(1.5px 1.5px at 300px 100px, white, transparent),
      radial-gradient(1px 1px at 340px 260px, white, transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
    opacity: 0.6;
    animation: drift 60s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to { background-position: -400px 400px; }
  }
  .card {
    position: relative;
    z-index: 1;
    max-width: 560px;
    width: 90%;
    padding: 2.5rem 2rem;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 {
    margin: 0 0 0.3rem;
    font-size: 1.8rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    margin: 0 0 1.8rem;
    color: #b8b8e0;
    font-size: 0.95rem;
  }
  #factBox {
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2rem;
    margin-bottom: 1.8rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    font-size: 1.1rem;
    line-height: 1.5;
    transition: opacity 0.25s ease;
  }
  button {
    border: none;
    padding: 0.9rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0b0c2a;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(125,211,252,0.35); }
  button:active { transform: translateY(0); }
  .counter {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: #8888b0;
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="card">
  <h1>🚀 Space Fact Generator</h1>
  <p class="sub">Click the button to discover something new about the cosmos</p>
  <div id="factBox">Press the button to reveal a space fact!</div>
  <button id="factBtn">✨ Give Me a Fact</button>
  <div class="counter" id="counter">Facts seen: 0</div>
</div>

<script>
  const facts = [
    "A day on Venus is longer than its year — it takes 243 Earth days to rotate once, but only 225 to orbit the Sun.",
    "Neutron stars are so dense that a single teaspoon of their material would weigh about a billion tons.",
    "There are more stars in the observable universe than grains of sand on all of Earth's beaches.",
    "Jupiter's Great Red Spot is a storm that has been raging for at least 350 years and is larger than Earth.",
    "Space is completely silent because there's no atmosphere to carry sound waves.",
    "The footprints left by astronauts on the Moon will likely stay there for millions of years since there's no wind or water to erode them.",
    "One million Earths could fit inside the Sun.",
    "Saturn could float in water because it's mostly made of gas and is less dense than water.",
    "The Milky Way galaxy is on a collision course with the Andromeda galaxy, expected to merge in about 4.5 billion years.",
    "A full NASA space suit costs about $12 million, most of which goes into the backpack and control module.",
    "Light from the Sun takes about 8 minutes and 20 seconds to reach Earth.",
    "There is a giant storm on Jupiter called the Great Red Spot that could fit two to three Earths inside it.",
    "Black holes can slow down time in their vicinity due to their immense gravity, an effect called time dilation.",
    "The largest known star, UY Scuti, is so big that it would take a passenger jet around 1,100 years to fly around it once.",
    "Mars has the largest volcano in the solar system, Olympus Mons, which is about three times the height of Mount Everest."
  ];

  let lastIndex = -1;
  let count = 0;
  const factBox = document.getElementById('factBox');
  const counter = document.getElementById('counter');

  document.getElementById('factBtn').addEventListener('click', () => {
    let index;
    do {
      index = Math.floor(Math.random() * facts.length);
    } while (index === lastIndex && facts.length > 1);
    lastIndex = index;
    count++;

    factBox.style.opacity = 0;
    setTimeout(() => {
      factBox.textContent = facts[index];
      factBox.style.opacity = 1;
    }, 150);

    counter.textContent = `Facts seen: ${count}`;
  });
</script>
</body>
</html>
